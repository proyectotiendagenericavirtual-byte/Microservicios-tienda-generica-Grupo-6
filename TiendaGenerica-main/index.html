```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Tienda Genérica</title>

  <link rel="stylesheet" href="css/estilo.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #2563eb 0%, transparent 35%),
        radial-gradient(circle at bottom right, #7c3aed 0%, transparent 35%),
        #0f172a;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1e293b;
    }

    /* Fondo decorativo */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      z-index: -1;
    }

    body::before {
      width: 300px;
      height: 300px;
      background: #3b82f6;
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 350px;
      height: 350px;
      background: #8b5cf6;
      bottom: -150px;
      right: -100px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      padding: 42px 38px;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.30),
        0 8px 25px rgba(0, 0, 0, 0.12);

      animation: aparecer 0.5s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: linear-gradient(135deg, #2563eb, #7c3aed);

      color: white;
      font-size: 28px;
      font-weight: 800;

      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header h1 {
      font-size: 27px;
      font-weight: 750;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .login-header p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;

      font-weight: 650;
      color: #334155;
    }

    .input-wrapper {
      position: relative;

    .input-icon {
      position: absolute;

      color: #94a3b8;

    }

      padding: 0 15px 0 45px;

      font-size: 14px;

      outline: none;

    }

    .form-group input::placeholder {
      color: #a0aec0;
    }

    .form-group input:hover {
      border-color: #b8c4d4;

    }

    .form-group input:focus {
      border-color: #3b82f6;

      font-size: 13px;
      font-weight: 550;

      animation: errorEntrada 0.25s ease;
    }

    .msg.error::before {
      content: "!";
      width: 20px;
      height: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #dc2626;

      font-size: 12px;
      font-weight: 800;
    }

    @keyframes errorEntrada {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    .security-info {
      display: flex;

      text-align: center;
      margin-top: 20px;

      color: rgba(255, 255, 255, 0.65);
      font-size: 11px;

      body {
        padding: 16px;
      }

      .login-card {
        padding: 34px 24px;
        border-radius: 20px;
      }

      .login-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="login-card">

      <div class="logo">
        TG
      </div>

      <div class="login-header">
        <h1>Bienvenido</h1>
        <p>
          Ingresa tus credenciales para acceder<br>
          al sistema de gestión de la tienda.
        </p>
      </div>

      <form onsubmit="event.preventDefault(); ingresar();">

        <div class="form-group">
          <label for="usuario">Usuario</label>

          <div class="input-wrapper">
            <span class="input-icon">👤</span>

            <input
              type="text"
              id="usuario"
              placeholder="Ingresa tu usuario"
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>

          <div class="input-wrapper">
            <span class="input-icon">🔒</span>

            <input
              type="password"
              id="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
            >
          </div>
        </div>

        <button type="submit" class="btn-login">
          Iniciar sesión
        </button>

        <button
          type="button"
          class="btn-cancel"
          onclick="limpiarFormulario()"
        >
          Cancelar
        </button>

        <div id="mensaje"></div>

      </form>

      <div class="security-info">
        🔐 Acceso seguro al sistema
      </div>

    </div>

    <div class="footer">
      Tienda Genérica · Sistema de Gestión
    </div>

  </div>


  <script src="js/db.js"></script>

  <script>
    function ingresar() {

      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      const mensaje = document.getElementById('mensaje');

      mensaje.innerHTML = '';

      if (!usuario || !password) {
        mensaje.innerHTML =
          '<div class="msg error">Por favor, completa todos los campos.</div>';
        return;
      }

      const usuarios = DB.get(DB.KEYS.usuarios);

      const encontrado = usuarios.find(
        u => u.usuario === usuario && u.password === password
      );

      if (encontrado) {

        DB.set(DB.KEYS.sesion, encontrado);

        window.location.href = 'menu.html';

      } else {

        mensaje.innerHTML =
          '<div class="msg error">Usuario o contraseña incorrectos. Intenta nuevamente.</div>';

        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }


    function limpiarFormulario() {

      document.getElementById('usuario').value = '';
      document.getElementById('password').value = '';
      document.getElementById('mensaje').innerHTML = '';

      document.getElementById('usuario').focus();
    }


    document.getElementById('usuario').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        ingresar();
      }
    });
  </script>

</body>
</html>
